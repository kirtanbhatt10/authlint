[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "authlint"
dynamic = ["version"]
description = "Audit OAuth 2.0 and OpenID Connect providers, key sets and clients against the OAuth security BCP (RFC 9700)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Kirtan Bhatt", email = "kirtan11bhatt@gmail.com" }]
keywords = ["oauth", "oidc", "openid-connect", "security", "jwks", "pkce", "sarif", "rfc9700"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
authlint = "authlint.cli:main"

[project.urls]
Homepage = "https://github.com/kirtanbhatt10/authlint"
Issues = "https://github.com/kirtanbhatt10/authlint/issues"

[tool.hatch.version]
path = "src/authlint/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length is left to ruff format
