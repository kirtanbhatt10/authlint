name: authlint
description: Audit OAuth 2.0 / OpenID Connect providers against RFC 9700 and fail the job on risky findings
author: Kirtan Bhatt
branding:
  icon: lock
  color: blue

inputs:
  providers:
    description: Space-separated issuer URLs or metadata files to audit
    required: true
  fail-on:
    description: Fail when a finding is at least this severe (info, low, medium, high, critical)
    required: false
    default: high
  args:
    description: Extra authlint arguments, e.g. "--ignore AL110"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install authlint
      shell: bash
      run: python -m pip install --quiet "$GITHUB_ACTION_PATH"
    - name: Run authlint
      shell: bash
      env:
        AL_PROVIDERS: ${{ inputs.providers }}
        AL_FAIL_ON: ${{ inputs.fail-on }}
        AL_ARGS: ${{ inputs.args }}
      run: |
        status=0
        for target in $AL_PROVIDERS; do
          # shellcheck disable=SC2086 # word-splitting of extra args is intended
          authlint provider "$target" $AL_ARGS --format markdown --fail-on "$AL_FAIL_ON" >> "$GITHUB_STEP_SUMMARY" || status=$?
        done
        exit $status
